name: Check

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Portable checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true

      - name: Report the environment
        run: |
          mise --version
          python3 --version
          mise x -- ruff --version

      # Lint, unit tests, manifest validation, and a catalog smoke test. The
      # desktop checks (omarchy-plugin-validate, qmllint) need Omarchy and are
      # run by maintainers with `mise run omarchy:check-desktop`.
      - name: Run portable checks
        run: mise run omarchy:check

  python-versions:
    name: Tests on Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor (tomllib); 3.13 guards against upcoming breakage.
        python: ["3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Run the unit tests
        env:
          PYTHONPATH: scripts/python
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover --start-directory tests --verbose
